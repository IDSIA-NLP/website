# Checks that the site builds without errors. Runs on every proposed change
# and on main. It does NOT publish anything: the official site is built by the
# IDSIA server from the main branch (see deploy/pull-site.sh).
name: Build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.145.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          curl -sSL -o hugo.tgz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tgz hugo && sudo mv hugo /usr/local/bin/

      - name: Convert publications
        run: python3 scripts/bib2json.py

      - name: Build
        run: hugo --gc --minify
