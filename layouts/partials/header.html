<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "" | relURL }}">
      <span class="brand-mark" aria-hidden="true">NLP</span>
      <span class="brand-text">NLP Group<span class="brand-sub">IDSIA USI-SUPSI</span></span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Open menu">
    <label for="nav-toggle" class="nav-toggle-label" aria-hidden="true"><span></span></label>
    <nav class="site-nav" aria-label="Main">
      {{ $current := . }}
      {{ range site.Menus.main }}
        {{ $active := or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }}
        {{ with .Page }}{{ $active = or $active ($current.IsDescendant .) }}{{ end }}
        <a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
